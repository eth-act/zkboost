[workspace]
members = [
    "crates/server",
    "crates/types",
    "crates/mock-zkattestor",
    "crates/guest-loader",
]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unnameable_types = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
result_large_err = "allow"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8"
bytes = "1"
clap = "4.5"
futures = "0.3"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
lru = "0.12"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
rand = "0.9.2"
reqwest = "0.12"
reqwest-eventsource = "0.6"
serde = "1.0"
serde_json = "1"
sha2 = "0.10.9"
strum = "0.27.2"
thiserror = "2"
tokio = "1.48"
tokio-stream = "0.1"
tokio-util = "0.7"
toml_edit = "0.24"
tower = "0.5"
tower-http = "0.6"
opentelemetry = "0.31"
opentelemetry-otlp = "0.31"
opentelemetry_sdk = "0.31"
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = "0.3"
url = { version = "2.5.7", features = ["serde"] }

# lighthouse
ethereum_serde_utils = "0.8.0"
lighthouse_types = { git = "https://github.com/sigp/lighthouse", branch = "unstable", package = "types" }
lighthouse_bls = { git = "https://github.com/sigp/lighthouse", branch = "unstable", package = "bls" }
lighthouse_eth2_keystore = { git = "https://github.com/sigp/lighthouse", branch = "unstable", package = "eth2_keystore" }

# libssz
libssz = "0.3.0"
libssz-derive = "0.3.0"
libssz-merkle = "0.3.0"

# alloy
alloy-consensus = "2"
alloy-eips = "2"
alloy-primitives = { version = "1.6", features = ["k256", "serde"] }
alloy-rlp = "0.3"
alloy-rpc-types-engine = "2"

# ere
ere-server-client = { git = "https://github.com/eth-act/ere", tag = "v0.17.0" }
ere-verifier = { git = "https://github.com/eth-act/ere", tag = "v0.17.0" }
ere-catalog = { git = "https://github.com/eth-act/ere", tag = "v0.17.0" }
ere-cluster-client-zisk = { git = "https://github.com/eth-act/ere", tag = "v0.17.0" }
ere-verifier-zisk = { git = "https://github.com/eth-act/ere", tag = "v0.17.0" }

# ere-guests
stateless-validator-common = { git = "https://github.com/eth-act/ere-guests", tag = "v0.17.0", features = ["host"] }

# local
zkboost-types = { path = "crates/types" }
