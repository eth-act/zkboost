[package]
name = "zkboost-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "zkboost"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
lru.workspace = true
memchr.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["json", "multipart"] }
reqwest-eventsource.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
strum = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true, features = ["rt"] }
toml_edit = { workspace = true, features = ["serde"] }
tower-http = { workspace = true, features = ["catch-panic"] }
opentelemetry.workspace = true
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic"] }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true

# lighthouse
lighthouse_bls.workspace = true
lighthouse_types.workspace = true
lighthouse_eth2_keystore.workspace = true
ethereum_serde_utils.workspace = true

# libssz, which the derive macros name
libssz.workspace = true
libssz-derive.workspace = true
libssz-merkle.workspace = true

# alloy
alloy-eips.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-rpc-types-engine.workspace = true

# ere
ere-server-client = { workspace = true, features = ["otel"] }
ere-catalog.workspace = true
ere-cluster-client-zisk.workspace = true
ere-verifier-zisk.workspace = true

# ere-guests
stateless-validator-common.workspace = true
