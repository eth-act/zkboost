[package]
name = "zkboost-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "zkboost"
path = "src/bin/zkboost.rs"

[lints]
workspace = true

[features]
default = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
    "ere-server-client/otel",
]

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["macros"] }
bytes.workspace = true
clap = { workspace = true, features = ["derive"] }
lru.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util.workspace = true
toml_edit = { workspace = true, features = ["serde"] }
tower.workspace = true
tower-http = { workspace = true, features = ["catch-panic", "trace", "limit"] }
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic"], optional = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"], optional = true }
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "registry"] }
url.workspace = true

# lighthouse
lighthouse_bls.workspace = true
lighthouse_types.workspace = true
lighthouse_eth2_keystore.workspace = true
ethereum_serde_utils.workspace = true

# alloy
alloy-consensus.workspace = true
alloy-eips = { workspace = true, features = ["serde"] }
alloy-primitives.workspace = true
alloy-rlp.workspace = true

# ere
ere-server-client.workspace = true
ere-verifier.workspace = true
ere-cluster-client-zisk.workspace = true
ere-verifier-zisk.workspace = true

# ere-guests
stateless-validator-common.workspace = true

# local
zkboost-types.workspace = true

[dev-dependencies]
alloy-rpc-types-engine = { workspace = true, features = ["jwt"] }
jsonwebtoken.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[[test]]
name = "otel_request_span"
required-features = ["otel"]
