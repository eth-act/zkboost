participants:
  - el_type: geth
    el_image: ethpandaops/geth:glamsterdam-devnet-8-aa1f2fc
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:unstable-afadb9a
    count: 3
  # The Lighthouse that executes through the mock beacon node. It has no execution client and
  # no validators.
  - el_type: None
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:unstable-afadb9a
    validator_count: 0
    cl_extra_params:
      - --execution-endpoint=http://mock-beacon-node:8551
      - --execution-jwt-secret-key=0xdc49981516e8e72b401a63e6405495a32dafc3939b5d6d83cc319ac0388bca1b
  # With the optional Ere GPU prover of the Compose file, this Lighthouse comes from eth-act
  # instead, executes through zkboost, and gossips the proofs that zkboost posts to it.
  #   cl_image: lighthouse:eth-act-optional-proofs-gloas
  #   cl_extra_params:
  #     - --execution-endpoint=http://zkboost:3000
  #     - --execution-jwt-secret-key=0xdc49981516e8e72b401a63e6405495a32dafc3939b5d6d83cc319ac0388bca1b
  #     - --proof-engine=/config/proof-engine.json
  #   cl_extra_mounts:
  #     /config: proof-engine.json
  # Proof observer: no execution client, Engine API endpoint, or validators. It imports every
  # payload after its proofs.
  # - el_type: None
  #   cl_type: lighthouse
  #   cl_image: lighthouse:eth-act-optional-proofs-gloas
  #   validator_count: 0
  #   cl_extra_params:
  #     - --proof-engine=/config/proof-engine.json
  #   cl_extra_mounts:
  #     /config: proof-engine.json
network_params:
  gloas_fork_epoch: 0
  # Gives Compose the time to start zkboost before slot 0, so every payload gets its proofs.
  # genesis_delay: 120
# The verifying key of the mock OpenVM guest, mock-guest/openvm.vk, for both proof types.
# extra_files:
#   proof-engine.json: |
#     {
#       "execution_proofs": [
#         { "proof_type": 1, "program_vk": "" },
#         { "proof_type": 4, "program_vk": "" }
#       ]
#     }
port_publisher:
  el:
    enabled: true
    public_port_start: 32000
  cl:
    enabled: true
    public_port_start: 33000
additional_services:
  - spamoor
spamoor_params:
  spammers:
  - scenario: eoatx
    config:
      throughput: 1
  - scenario: erctx
    config:
      throughput: 1
