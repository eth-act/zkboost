port = 3000
el_engine_endpoint = "http://geth:8551"
cl_beacon_endpoint = "http://mock-beacon-node:3001"
# With the proof observer of network_params.yaml, the eth-act Lighthouse receives the proofs and
# gossips them.
# cl_beacon_endpoint = "http://cl-4-lighthouse:4000"
# Validator 256 of the Kurtosis testnet, the first validator of the third participant, with the
# keystore of docker/example/testnet/validator-keys.
validator_keystore_path = "/validator-keys/keys/0xb756817e69f8ae36929d275d0c0de9013520090965cb0a2f50eb72e099a33aad6515a660d64cdd9f75c9b9dd827d852f/voting-keystore.json"
validator_keystore_password_path = "/validator-keys/secrets/0xb756817e69f8ae36929d275d0c0de9013520090965cb0a2f50eb72e099a33aad6515a660d64cdd9f75c9b9dd827d852f"

[dashboard]
enabled = true

# With the optional Ere GPU prover of the Compose file, both mocks prove the expected public values
# there.
[[zkvm]]
kind = "mock"
proof_type = "ethrex-openvm"
mock_proving_time = { kind = "random", min_ms = 2000, max_ms = 8000 }
# endpoint = "http://openvm:3000"

[[zkvm]]
kind = "mock"
proof_type = "reth-openvm"
mock_proving_time = { kind = "random", min_ms = 3000, max_ms = 9000 }
