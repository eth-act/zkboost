services:
  geth:
    image: ethpandaops/geth:glamsterdam-devnet-8-aa1f2fc
    entrypoint: ["/bin/sh", "/start_geth.sh"]
    command: ["http://el-1-geth-lighthouse:8545"]
    volumes:
      - ../../scripts/start_geth.sh:/start_geth.sh:ro
      - ../../scripts/genesis-${ENCLAVE_NAME:-local-testnet}.json:/genesis.json:ro
    networks:
      - zkboost
      - kurtosis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "geth", "--exec", "eth.blockNumber", "attach", "/data/geth.ipc"]
      interval: 2s
      timeout: 5s
      retries: 30

  zkboost:
    image: zkboost:local
    build:
      context: ../../..
      dockerfile: ./docker/Dockerfile
    command: ["--config", "/app/config.toml"]
    ports:
      - "3000:3000"
    depends_on:
      geth:
        condition: service_healthy
    volumes:
      - ./zkboost/config.toml:/app/config.toml:ro
      - ../testnet/validator-keys:/validator-keys:ro
    networks:
      - zkboost
    environment:
      - RUST_LOG=info,zkboost=debug
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_SERVICE_NAME=zkboost
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      start_period: 1s
      start_interval: 1s
    restart: unless-stopped

  mock-beacon-node:
    image: zkboost:local
    entrypoint: ["/usr/local/bin/mock-beacon-node"]
    command:
      - "--cl-endpoint"
      - "http://cl-1-lighthouse-geth:4000"
      - "--zkboost-endpoint"
      - "http://zkboost:3000"
      - "--proof-types"
      - "reth-zisk,reth-sp1,reth-openvm"
      - "--port"
      - "3001"
    networks:
      - zkboost
      - kurtosis
    environment:
      - RUST_LOG=info,zkboost=debug
    depends_on:
      zkboost:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.10.0
    ports:
      - "9090:9090"
    networks:
      - zkboost
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      zkboost:
        condition: service_healthy
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.3
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    networks:
      - zkboost
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3002:3000"
    networks:
      - zkboost
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
      - tempo

volumes:
  prometheus_data:
  grafana_data:
  tempo_data:

networks:
  zkboost: {}
  kurtosis:
    name: kt-${ENCLAVE_NAME:-local-testnet}
    external: true
