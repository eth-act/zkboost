# The guest ELFs come from the ere-guests release of the ere version of the images.
services:
  geth:
    image: ethpandaops/geth:glamsterdam-devnet-8-aa1f2fc
    entrypoint: ["/bin/sh", "/start_geth.sh"]
    command: ["http://el-1-geth-lighthouse:8545"]
    volumes:
      - ../../scripts/start_geth.sh:/start_geth.sh:ro
      - ../../scripts/genesis-${ENCLAVE_NAME:-local-testnet}.json:/genesis.json:ro
    networks:
      - zkboost
      - kurtosis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "geth", "--exec", "eth.blockNumber", "attach", "/data/geth.ipc"]
      interval: 2s
      timeout: 5s
      retries: 30

  ethrex-openvm:
    image: ghcr.io/eth-act/ere/ere-server-openvm:0.19.5-cuda
    command:
      - "--port"
      - "3000"
      - "--elf-url"
      - "https://github.com/eth-act/ere-guests/releases/download/v0.19.0/stateless-validator-ethrex-openvm-v2.1.0-preview.elf"
      - "gpu"
    shm_size: 2G
    networks:
      - zkboost
    environment:
      - RUST_LOG=info
      - ERE_OPENVM_SETUP_ON_INIT=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/health"]
      start_period: 600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  # Fills the ZisK proving key volume once, with the same archive and `.md5` marker as
  # crates/prover/zisk/src/sdk/proving_key.rs of the ere version of the image.
  zisk-proving-key:
    image: ghcr.io/eth-act/ere/ere-server-zisk:0.19.5-cuda
    entrypoint: bash
    working_dir: /root/.zisk/provingKey
    command:
      - -ec
      - |
        MD5=5bb0a34749bb366d82734116ce4384e5
        grep -qx $$MD5 .md5 2>/dev/null && exit 0
        curl -fsSL -o key.tar.gz https://storage.googleapis.com/zisk-setup/zisk-provingkey-1.3.2-alpha-blake3.tar.gz
        echo "$$MD5  key.tar.gz" | md5sum -c
        tar xzf key.tar.gz -C /root/.zisk
        rm key.tar.gz
        echo $$MD5 > .md5
    networks:
      - zkboost
    volumes:
      - zisk-proving-key-v1.3.2-alpha:/root/.zisk/provingKey

  reth-zisk:
    image: ghcr.io/eth-act/ere/ere-server-zisk:0.19.5-cuda
    command:
      - "--port"
      - "3000"
      - "--elf-url"
      - "https://github.com/eth-act/ere-guests/releases/download/v0.19.0/stateless-validator-reth-zisk-v1.3.2-alpha.elf"
      - "gpu"
    shm_size: 32G
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - zkboost
    environment:
      - RUST_LOG=info,asm_runner=warn,executor=warn,mem_planner_cpp=warn,proofman=warn,rom_setup=warn,sm_rom=warn,zisk=warn
      - ERE_ZISK_SETUP_ON_INIT=1
    volumes:
      - zisk-proving-key-v1.3.2-alpha:/root/.zisk/provingKey
    restart: unless-stopped
    depends_on:
      zisk-proving-key:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      start_period: 600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

  zkboost:
    image: zkboost:local
    build:
      context: ../../..
      dockerfile: ./docker/Dockerfile
    command: ["--config", "/app/config.toml"]
    ports:
      - "3000:3000"
    depends_on:
      geth:
        condition: service_healthy
      ethrex-openvm:
        condition: service_healthy
      reth-zisk:
        condition: service_healthy
    volumes:
      - ./zkboost/config.toml:/app/config.toml:ro
      - ./validator-keys:/validator-keys:ro
    networks:
      - zkboost
      - kurtosis
    environment:
      - RUST_LOG=info,zkboost=debug
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      start_period: 1s
      start_interval: 1s

# The ZisK proving key, which zisk-proving-key downloads once.
volumes:
  zisk-proving-key-v1.3.2-alpha:

# Only geth and zkboost join the enclave network to reach the testnet EL and CL.
networks:
  zkboost: {}
  kurtosis:
    name: kt-${ENCLAVE_NAME:-local-testnet}
    external: true
