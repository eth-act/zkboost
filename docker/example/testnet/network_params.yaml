participants:
  - el_type: geth
    el_image: ethpandaops/geth:glamsterdam-devnet-8-aa1f2fc
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:unstable-afadb9a
  # The eth-act lighthouse behind zkboost. It receives the execution proofs, which zkboost signs
  # as its first validator, 128. It has no EL of its own, because the package sets
  # --execution-endpoints for a paired EL and lighthouse takes the flag once.
  - el_type: None
    cl_type: lighthouse
    cl_image: lighthouse:eth-act-optional-proofs-gloas
    cl_extra_params:
      - --execution-endpoint=http://zkboost:3000
      - --execution-jwt-secret-key=0xdc49981516e8e72b401a63e6405495a32dafc3939b5d6d83cc319ac0388bca1b
      - --proof-engine=/config/proof-engine.json
    cl_extra_mounts:
      /config: proof-engine.json
  - el_type: geth
    el_image: ethpandaops/geth:glamsterdam-devnet-8-aa1f2fc
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:unstable-afadb9a
  # The EL of zkboost, fed by zkboost alone once the start script stops its lighthouse. Geth returns no witness
  # for a known payload. We can switch to `POST /engine/v1/payloads/witness` once
  # https://github.com/ethereum/execution-apis/pull/885 is implemented.
  - el_type: geth
    el_image: ethpandaops/geth:glamsterdam-devnet-8-aa1f2fc
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:unstable-afadb9a
    validator_count: 0
network_params:
  gloas_fork_epoch: 0
# The verifying keys of the reth guests of the ere-guests v0.17.0 release, the guests of the
# provers, for the proof types lighthouse supports.
extra_files:
  proof-engine.json: |
    {
      "execution_proofs": [
        {
          "proof_type": 1,
          "zkvm": "openvm",
          "program_vk": ""
        },
        {
          "proof_type": 2,
          "zkvm": "sp1",
          "program_vk": "0x00a03cbfa95559cfee3b45ef925f3f7a631181e35e774e92b040277d893511dd"
        },
        {
          "proof_type": 3,
          "zkvm": "zisk",
          "program_vk": "0x7b0f7b082966c8155b496c2e1a371b3824b461ad2e1c2931f222c63a10004a14"
        }
      ]
    }
additional_services:
  - spamoor
spamoor_params:
  spammers:
  - scenario: eoatx
    config:
      throughput: 1
  - scenario: erctx
    config:
      throughput: 1
port_publisher:
  el:
    enabled: true
    public_port_start: 32000
  cl:
    enabled: true
    public_port_start: 33000
