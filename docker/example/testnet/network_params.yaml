participants:
  - el_type: geth
    el_image: ethpandaops/geth:glamsterdam-devnet-8-aa1f2fc
    cl_type: lighthouse
    cl_image: ethpandaops/lighthouse:unstable-afadb9a
    count: 2
  # The eth-act lighthouse behind zkboost. It receives the execution proofs, which zkboost signs
  # as its first validator at index 256.
  - el_type: None
    cl_type: lighthouse
    cl_image: lighthouse:eth-act-optional-proofs-gloas
    cl_extra_params:
      - --execution-endpoint=http://zkboost:3000
      - --execution-jwt-secret-key=0xdc49981516e8e72b401a63e6405495a32dafc3939b5d6d83cc319ac0388bca1b
      - --proof-engine=/config/proof-engine.json
    cl_extra_mounts:
      /config: proof-engine.json
  # Proof-only observer: no execution client, Engine API endpoint, or validators.
  # Receives proofs over gossip from the third Lighthouse after zkboost submits them.
  - el_type: None
    cl_type: lighthouse
    cl_image: lighthouse:eth-act-optional-proofs-gloas
    validator_count: 0
    cl_extra_params:
      - --proof-engine=/config/proof-engine.json
    cl_extra_mounts:
      /config: proof-engine.json
network_params:
  gloas_fork_epoch: 0
